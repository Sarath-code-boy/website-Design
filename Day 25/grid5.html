<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-5</title>
</head>
<style>
    .container
    {
        display: grid;
        background-color: aqua;
        grid-template-columns: auto auto auto auto;
        gap: 20px;
        column-gap: 30px;
        row-gap: 20px;
        padding: 30px;
    }
    .container>div
    {
        background-color: rgb(153, 153, 71);
        color: white;
        border: 1px solid black;
        padding: 20px;
        font-size: 30px;
        text-align: center;

    }
</style>
<body>
    <div class="container">
       <div>1</div>
       <div>2</div>
       <div>3</div>
       <div>4</div>
       <div>5</div>
       <div>6</div>
       <div>7</div>
       <div>8</div>
       <div>9</div>
       <div>10</div>
    </div>
</body>
</html>
