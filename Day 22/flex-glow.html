<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .glow
         {
            display: flex;
            background-color: aqua;
            
         }
         .glow>div
         {
            
            background-color: blue;
            margin: 10px;
            padding: 20px;
            font-size: 20px;
            text-align: center;
         }
         .one
         {
            flex-grow: 0;
         }
         .two
         {
            flex-grow: 1;
         }
         .three
         {
            flex-grow: 1;
         }
    </style>
</head>
<body>
    <div class="glow">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div>4</div>
    </div>
</body>
</html>
