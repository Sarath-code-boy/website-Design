<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //class
        //A JavaScript class is a blueprint for creating objects. It groups related data
        //  (properties) and functions (methods) into a single reusable template.
        class student
        {
            constructor(name,age,grade)
            {
               this.name=name;
               this.age=age;
               this.grade=grade; 
            }
            display()
            {
                document.write("name:"+this.name+"<br>");
                document.write("age:"+this.age+"<br>");
                document.write("grade:"+this.grade+"<br>");
            }
               
        }
        const s1=new student("sarath",20,"B");
        s1.display()
    </script>
</body>
</html>
