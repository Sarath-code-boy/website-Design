<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- constructor -->
    <!-- A constructor is a special method that automatically runs 
    when a new object is created and is used to give initial values to that object. -->
    <script>
        class Employee
        {
            constructor(id,name)
            {
                this.id=id;
                this.name=name;
            }
        }
        const emp=new Employee(101,"john");
        console.log(emp.id);
        console.log(emp.name)

    </script>
</body>
</html>
