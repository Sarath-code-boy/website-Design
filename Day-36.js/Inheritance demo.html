<body>
    <script>
        class Animal
        {
            eat()
            {
                document.write("Animal is eating <br>")

        class Dog extends Animal
        {
            bark()
            {
                document.write("dog is bark <br>")
            }
        }
        const dog=new Dog();
        dog.eat();
        dog.bark();
    </script>
