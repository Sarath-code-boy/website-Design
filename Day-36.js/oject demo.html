<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const student={
            name:"Sarath",
            age:20,
            grade:"A",
            display:function()
            {
                document.write("name:"+this.name+"<br>")
                document.write("age:"+this.age+"<br>")
                document.write("grade:"+this.grade+"<br>")
            }
        };
        student.display()
    </script>
</body>
</html>
