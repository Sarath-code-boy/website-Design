<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide an element</title>
</head>
<style>
    
        @media (max-width:600px)
        {
            .Hide
            {
                display: none;
            }    
        }
    
</style>
<body>
    <p class="Hide">
        this id the hide element smaller then 600px.
    </p>
</body>
</html>
