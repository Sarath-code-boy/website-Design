<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding-Text</title>
</head>
<style>
    .sliding
    {
        font-size: 24px;
        color: #9b5966;
        animation: slideText 3s linear infinite;
    }
    @keyframes slideText
    {
        0%
        {
            transform: translateX(0);
        }
        50%
        {
            transform: translateX(200px);
        }
        100%
        {
            transform: translateX(0);
        }
    }
</style>
<body>
    <div class="sliding">Sliding-Text</div>
</body>
</html>
