<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zoom in effect</title>
</head>
   <!-- ZoomIn effect -->
   <style>
    .zoom
    {
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 50%;
        margin: 30px;
        animation:ZoomIn 2s linear infinite;
    }
    @keyframes ZoomIn
    {
         0%
         {
          transform: scale(1);  
         }
         50%
         {
            transform: scale(1.5);
         }
         100%
         {
            transform: scale(1);
         }
    }
   </style>
<body>
    <div class="zoom"></div>
</body>
</html>
