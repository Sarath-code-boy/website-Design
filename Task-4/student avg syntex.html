<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks</title>
</head>
<body>

<script>

for (var student = 1; student <= 5; student++)
{
    var total = 0;

    document.write("<h3>Student " + student + "</h3>");

    for (var subject = 1; subject <= 4; subject++)
    {
        var mark = parseInt(prompt("Enter Student " + student + " Subject " + subject + " Mark"));

        total = total + mark;

        document.write("Subject " + subject + " Mark : " + mark + "<br>");
    }

    var average = total / 4;

    document.write("<b>Total : " + total + "</b><br>");
    document.write("<b>Average : " + average + "</b>");
    document.write("<hr>");
}

</script>

</body>
</html>
