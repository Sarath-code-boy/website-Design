<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Theatre Seating</title>
</head>
<body>

<script>

for (var row = 1; row <= 6; row++)
{
    for (var seat = 1; seat <= 8; seat++)
    {
        document.write("Row " + row + " Seat " + seat + " ");
    }

    document.write("<br><br>");
}

</script>

</body>
</html>
