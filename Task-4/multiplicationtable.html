<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var number=parseInt(prompt("Enter the number"))
        for(var i=1; i<=10; i++)
        
    {
        document.write(number+"x"+i+"="+(number*i)+"<br>");
        
    }
    </script>
</body>
</html>
