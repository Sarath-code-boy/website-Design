<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var number=parseInt(prompt("Enter the number"));
        for(i=1; i<=number; i++)
    {
        for(j=1; j<=number; j++)
    {
        document.write("* ");
    }
        document.write("<br>");
    }
    </script>
</body>
</html>
