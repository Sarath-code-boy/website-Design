<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const empname= new Array("azar","sarath","raja");
        //length(how many names is here like 3)
        console.log(empname.length)
        //to string
        console.log(empname.toString())
        //at(to at thi value print 2--value is raja it start with 0,1,2,3)
        console.log(empname.at(2))
        //join(adding inside anyone like "-,#,_")
        console.log(empname.join("_"))
        //pop(Remove last element)
        console.log(empname.pop(0))
        //push
        empname.push("a1");
        console.log(empname)
        //shift
        empname.shift()
        console.log(empname)
        //unshift
        empname.unshift("shiva1")
        console.log(empname)
        //concat
        const empname1=["a1","a2"];
        console.log(empname.concat(empname1))
        //flat
        const empname2=[0,1,2,[3,4]];
        console.log(empname2.flat())
        //flatmap
        const empname3=[1,2,3];
        const result=empname3.flatMap(x=>[x*2]);
        console.log(result);
        //slice
        const fruit=["Apple","Banana","Orange","jerry"]
        console.log(fruit.slice(1,3))
        //
    </script>
</body>
</html>
