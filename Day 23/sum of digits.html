<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=parseInt(prompt("Enter the n value:"))
        var sum=0;
        while(n!=0)
    {
         var rem=n%10;
        sum=sum+rem;
        n=Math.floor(n/10)
    }
    document.write("Sum of Digits="+sum)
    
    </script> 
</body>
</html>
