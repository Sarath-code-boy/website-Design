<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var reverse=0;
        var n=parseInt(prompt("Enter the n value is:"))
        while(n!=0)
    {
        reverse=reverse*10;
        reverse=reverse+n%10;
        n=Math.floor(n/10);
    }
    document.write("Reverse value is::"+reverse)
    </script>
</body>
</html>
