<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Fibonacci</title>
</head>
<body>

<script>

var n = parseInt(prompt("Enter the value:"));

var a = 0;
var b = 1;
var c;

for (var i = 0; i < n; i++)
{
    document.write(a + " ");

    c = a + b;
    a = b;
    b = c;
}

</script>

</body>
</html>
</body>
