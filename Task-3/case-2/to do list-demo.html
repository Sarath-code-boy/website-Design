<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#eeeeee;
}

.container{
    width:700px;
    margin:60px auto;
    background:white;
    padding:30px;
    text-align:center;
    box-shadow:0px 0px 10px gray;
}

h1{
    margin-bottom:40px;
}

input{
    width:600px;
    padding:15px;
    font-size:20px;
}

#addBtn{
    margin-top:20px;
    padding:15px 30px;
    background:green;
    color:white;
    border:none;
    font-size:22px;
    cursor:pointer;
}

table{
    width:100%;
    margin-top:40px;
    border-collapse:collapse;
}

table,th,td{
    border:1px solid black;
}

th{
    padding:15px;
    font-size:20px;
}

td{
    padding:20px;
    font-size:18px;
    text-align:center;
}

button{
    background:green;
    color:white;
    border:none;
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}

.completed{
    text-decoration:line-through;
    color:gray;
}

h2{
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>To-Do List</h1>

<input type="text" id="task" placeholder="Enter Task"><br>

<button id="addBtn" onclick="addTask()">Add Task</button>

<table>
<thead>
<tr>
<th>Task</th>
<th>Complete</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="taskTable">

</tbody>

</table>

<h2>Pending Tasks : <span id="pending">0</span></h2>

</div>

<script>

function addTask(){

    let input=document.getElementById("task");
    let task=input.value.trim();

    if(task==""){
        alert("Please Enter Task");
        return;
    }

    let table=document.getElementById("taskTable");

    let row=document.createElement("tr");

    let taskCell=document.createElement("td");
    taskCell.innerText=task;

    let completeCell=document.createElement("td");
    let completeBtn=document.createElement("button");
    completeBtn.innerText="Completed";

    completeBtn.onclick=function(){

        taskCell.classList.toggle("completed");

        if(taskCell.classList.contains("completed")){
            completeBtn.innerText="Undo";
        }
        else{
            completeBtn.innerText="Completed";
        }

        updatePending();

    };

    completeCell.appendChild(completeBtn);

    let deleteCell=document.createElement("td");
    let deleteBtn=document.createElement("button");
    deleteBtn.innerText="Delete";

    deleteBtn.onclick=function(){

        row.remove();
        updatePending();

    };

    deleteCell.appendChild(deleteBtn);

    row.appendChild(taskCell);
    row.appendChild(completeCell);
    row.appendChild(deleteCell);

    table.appendChild(row);

    input.value="";

    updatePending();

}

function updatePending(){

    let rows=document.querySelectorAll("#taskTable tr");

    let count=0;

    rows.forEach(function(row){

        let task=row.cells[0];

        if(!task.classList.contains("completed")){
            count++;
        }

    });

    document.getElementById("pending").innerText=count;

}

</script>

</body>
</html>
