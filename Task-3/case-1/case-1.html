<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
        }
        label
        {
            font-size: 15px;
            margin-bottom: 10px;
            margin: 5px;
        }
        input
        {
            padding: 10px;
            width: 50%;
            margin: 5px;
        }
        button
        {
            border-style: none;
            background-color: rgb(10, 166, 190);
            color: white;
            padding: 10px;
            margin-left: 150px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        table
        {
          border-collapse: collapse;
            margin-top: 20px;    
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Student Registration Form</h2> <br>
    <label>Name </label> <br>
    <input type="text" id="name" placeholder="enter the name"><br><br>
    <label>Email </label> <br>
    <input type="email" id="email" placeholder="Enter the email"><br><br>
    <Label>course</Label> <br>
    <input type="text" id="course" placeholder="enter the course"><br><br>
    <Label>Mobile</Label> <br>
    <input type="number" id="number" placeholder="enter the number"><br>
    <br>
    <button onclick="addStudent()">Register</button>
    <table border="1" cellpadding="10" id="table">
        <thead>
        <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Mobile</th>
        <th>Delete</th>
        
        </tr>
        </thead>
        <tbody>
            <tbody id="studentTable">

            </tbody>
        </tbody>
    </table>
    <h3 id="total">Total Student : 0</h3>
    <script>
        
        function addStudent()
        {
        var name=document.getElementById("name").value;
        var email=document.getElementById("email").value;
        var course=document.getElementById("course").value;
        var mobile=document.getElementById("number").value;
        if(name=="")
    {
        alert("enter the name");
        return;
    }
        if(email=="")
    {
        alert("enter the email");
        return;
    }
    if(course=="")
    {
        alert("enter the course");
        return;
    }
    if(mobile=="")
    {
        alert("enter the mobile number");
        return;
    }
       var table=document.getElementById("studentTable");
       var row=document.createElement("tr");
       
       var td1=document.createElement("td");
       td1.innerText=name;
       var td2=document.createElement("td");
       td2.innerText=email;
       var td3=document.createElement("td");
       td3.innerText=course;
       var td4=document.createElement("td");
       td4.innerText=mobile;
       var td5=document.createElement("td");

       var btn=document.createElement("button");
       btn.innerText="delete";
    //    button.className="deletebutton";

       btn.onclick=function()
       {
        table.removeChild(row);
        countStudent();

       };
       td5.appendChild(btn);
        row.appendChild(td1);
row.appendChild(td2);
row.appendChild(td3);
row.appendChild(td4);
row.appendChild(td5);

table.appendChild(row);

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("course").value="";
document.getElementById("number").value="";

countStudent();

}

function countStudent(){

var total=document.getElementById("studentTable").rows.length;

document.getElementById("total").innerHTML="Total Students : "+total;

       }
    </script>
  </body>
</html>
