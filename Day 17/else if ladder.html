<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ladder</title>
    <script>
        var marks=parseInt(prompt("Enter the marks::"))
        if(marks>=90)
    {
        console.log("Grade-A")
    }
    else if (marks>=80)
    {
        console.log("Grade-B")
    }
    else if(marks>=70)
    {
        console.log("Grade-C")
    }
    else if(marks>=50)
    {
        console.log("Grade-D")
    }
    else if(marks>=35)
    {
        console.log("Grade-E")
    }
    else
    {
        console.log("Fail!!!")
    }

    </script>
</head>

</body>
</html>
