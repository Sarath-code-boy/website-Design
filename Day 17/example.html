<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
    
</head>
<body>
     <h2 id="d1"></h2>
     <script>
        var n=parseInt(prompt("Enter n value"))
        if(n%2==0)
    {
        document.getElementById("d1").innerHTML="It is Even"
    }
    else
    {
        document.getElementById("d1").innerHTML="It is Odd"
    }
    </script>
</body>
</html>
