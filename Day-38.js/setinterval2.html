<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="clock"></h2>
    <script>
        function updateclock()
        {
           const now=new Date();
           document.getElementById("clock").textContent=now.toLocaleTimeString();
        }
        setInterval(updateclock,1000);
    </script>
</body>
</html>
