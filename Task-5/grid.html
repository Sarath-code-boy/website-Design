<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body
    {
        font-family: Arial, Helvetica, sans-serif;
    }
    .container
    {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 60px 180px 180px 60px;
        gap: 15px;
        grid-template-areas:
        "header header"
        "article text1"
        "article text2"
        "main main"
        "footer footer" ;
    }
    .header
    {
        grid-area: header;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        align-items: center;
        color: white;
         
    }
    .article
    {
        grid-area: article;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        color: white;
        line-height: 20;

    }
    .text1
    {
        grid-area: text1;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        color: white;
        line-height: 10;
    }
    .text2
    {
        grid-area: text2;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        line-height: 10;
        color: white;
    }
    .main
    {
        grid-area: main;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        color: white;
        line-height: 4;
        

    }
    .footer
    {
        grid-area: footer;
        display: grid;
        background-color: rgb(42, 42, 67);
        text-align: center;
        color: white;
        padding: 15px;

    }
</style>
<body>
   <div class="container">
    <div class="header">Header</div>
    <div class="article">Article</div>
    <div class="text1">Text 1</div>
    <div class="text2">Text 2</div>
    <div class="main">Main</div>
    <div class="footer">Footer</div>
   </div> 
</body>
</html>
