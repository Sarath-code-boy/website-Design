<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

.hero{
    width:100%;
    height:600px;
    background-image:url("image/background.jpg");
    background-size:cover;
    background-position:center;
}

/* Social Icons */

.social{
    display:flex;
    justify-content:center;
    gap:15px;
    padding:10px;
}

.social i{
    width:35px;
    height:35px;
    background:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

/* Navigation */

nav{
    width:80%;
    height:70px;
    background:white;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:60px;
    height:60px;
}

.logo h2{
    color:#ff5b57;
}

nav ul{
    display:flex;
    list-style:none;
    gap:35px;
}

nav ul li a{
    text-decoration:none;
    color:#555;
    font-size:15px;
    font-weight:bold;
}

nav ul li a:hover{
    color:#ff5b57;
}

/* Hero Content */

.hero-content{
    height:500px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero-content h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero-content p{
    font-size:18px;
    margin-bottom:25px;
}

.hero-content button{
    padding:14px 35px;
    border:none;
    background:#ff5b57;
    color:white;
    font-size:18px;
    cursor:pointer;
    border-radius:4px;
}

.hero-content button:hover{
    background:#e54845;
}

</style>
</style>
<body>
    <div class="hero">

    <div class="social">
        <!-- Social icons -->
    </div>

    <nav>

        <div class="logo">
            Logo
        </div>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contacts</li>
            <li>Blog</li>
            <li>Contact</li>
        </ul>

    </nav>

    <div class="hero-content">

        <h1>Digital Studio</h1>

        <p>Company subtitle</p>

        <button>Contact</button>

    </div>

</div>
</body>
</html>
