<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .full
    {
        display: grid;
        grid-template-areas: 
        "a a a"
        "b c c"
        "b d d"
        "e e e"
        "f f f";
        background-color: white;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 80px 180px 180px 200px 80px;
        gap: 15px;
    }
    .a
    {
        grid-area: a;
        display: grid;
        background-color: aqua;
    }
    .b
    {
        grid-area: b;
        display: grid;
        background-color: aqua;
    }
    .c
    {
        grid-area: c;
        display: grid;
        background-color: aqua;
    }
    .d
    {
        grid-area: d;
        display: grid;
        background-color: aqua;
    }
    .e
    {
        grid-area: e;
        display: grid;
        background-color: aqua;
        /* height: 200px; */

    }
    .f
    {
        grid-area: f;
        display: grid;
        background-color: aqua;
    }
    
</style>
<body>
    <div class="full">
         <div class="a"></div>
         <div class="b"></div>
         <div class="c"></div>
         <div class="d"></div>
         <div class="e"></div>
         <div class="f"></div>
    </div>
</body>
</html>
