<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1
    {
        border: 1px solid black;
        margin-top: 5px;
        margin-bottom: 50px;

    }
    p
    {
        border: solid black;

    <p>That is for the outlining </p>
