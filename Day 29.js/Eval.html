<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eval</title>
</head>
<body>
    <p id="one"></p>
    <script>
        let x=500;
        let y=400;
        let t1="x-y";
        let result=eval(t1);
        document.getElementById("one").innerHTML=result;
    </script>
</body>
</html>
