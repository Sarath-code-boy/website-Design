<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>let</title>
</head>
<body>
    <h2>Rediclaring a variable using let</h2>
    <p id="demo"></p>
    <script>
        let x=10;
      
        //here x is 10
        {
            let x=2;
           
        //here x is 2
            document.write(x)
        }
        //here x is 10
        document.getElementById("demo").innerHTML=x;
    </script>
</body>
</html>
