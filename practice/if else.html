<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var mark=parseInt(prompt("Enter the mark:"))
        if(mark>=35)
    {
        if(mark>=90)
    {
        document.write("Pass - Grade A")
    }
      else if(mark>=75)
      {
        document.write("Pass - Grade B")
      }
      else if(mark>=50)
      {
        document.write("Pass - Grade C")
      }
      else if(mark>=35)
      {
        document.write("Pass - Grade D")
      }
    }
    else
      {
        document.write("Fail")
      }
    </script>
</head>

</body>
</html>
