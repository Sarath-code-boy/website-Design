<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flexbox Example</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    padding:20px;
}

h2{
    margin-top:30px;
    margin-bottom:10px;
}

.container{
    display:flex;
    border:3px solid black;
    background:white;
    height:250px;
    margin-bottom:30px;
}

.box{
    width:80px;
    height:80px;
    background:orange;
    color:white;
    font-size:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:5px;
}
.align
{
  align-items: center;
}
.align>div
{
    align-self: flex-end;
}
</style>

</head>
<body>

<!-- display:flex -->
<h2>1. display:flex</h2>

<div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- flex-direction -->
<h2>2. flex-direction: column</h2>

<div class="container" style="flex-direction:column;">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- justify-content -->
<h2>3. justify-content: space-evenly</h2>

<div class="container" style="justify-content:space-evenly;">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- align-items -->
<h2>4. align-items: center</h2>

<div class="container" style="align-items:center;">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- flex-wrap -->
<h2>5. flex-wrap: wrap</h2>

<div class="container" style="flex-wrap:wrap;">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
</div>

<!-- gap -->
<h2>6. gap:30px</h2>

<div class="container" style="gap:30px;">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- flex-grow -->
<h2>7. flex-grow</h2>

<div class="container">
    <div class="box" style="flex-grow:1;">1</div>
    <div class="box" style="flex-grow:2;">2</div>
    <div class="box" style="flex-grow:1;">3</div>
</div>

<!-- flex-shrink -->
<h2>8. flex-shrink</h2>

<div class="container" style="width:350px;">
    <div class="box" style="width:200px;flex-shrink:1;">1</div>
    <div class="box" style="width:200px;flex-shrink:0;">2</div>
    <div class="box" style="width:200px;flex-shrink:1;">3</div>
</div>

<!-- flex-basis -->
<h2>9. flex-basis</h2>

<div class="container">
    <div class="box" style="flex-basis:200px;">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

<!-- align-self -->
<!-- <h2>10. align-self</h2>

<div class="container" style="align-items:center;">
    <div class="box">1</div>
    <div class="box" style="align-self:flex-end;">2</div>
    <div class="box">3</div>
</div> -->
<h2>6. gap:30px</h2>

<div class="align">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
</div>

</body>
</html>
