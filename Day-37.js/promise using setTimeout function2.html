<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function one()
        {
            return new Promise((resolve,reject)=>{
                set(()=>{
                    const user={id:101,name:"sarath",role:"Devoloper"}
                    if(user)
                {
                    resolve(user)
                }
                else
                {
                    reject("user not found")
                }
                },3000)
            })
        }
        one()
        .then((data)=>{
            console.log("user Data:",data)
        })
        .catch((error)=>{
            console.error(error)
        })
    </script>
</body>
</html>
