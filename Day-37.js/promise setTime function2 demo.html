<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function two()
        {
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    const user={id:20,name:"sarath",role:"Devolopment"}
                    if(user)
                {
                    resolve(user)
                }
                else
                {
                    reject("this is not found")
                }
                },3000)
            })
        }
        two()
        .then((data)=>{
            console.log("user Data",data)})
        .catch((error)=>{
            console.error(error)
        })
    </script>
</body>
</html>
