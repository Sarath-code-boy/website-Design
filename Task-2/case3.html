    <!-- Nested if else statement -->
    <script>
        mark=parseInt(prompt("Enter the mark is:"))
        if (mark>=35)
    {
        if (mark>=90)
    {
        document.write("pass - Grade A+")
    }
    else if(mark>=75)
    {
        document.write("pass- Grade A")
    }
    else if (mark>=60)
    {
        document.write("pass - Grade B")
    }
    else if(mark>=35)
    {
        document.write("pass - Grade C")
    }
    }
    else
    {
        document.write("Fail")
      }
    </script>
