<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=4
        var b=10
        document.write("Bitwise AND::"+(a&b))
        document.write("Bitwise OR::"+(a|b))
        document.write("Bitwise XOR::"+(a^b))
        document.write("leftshift::"+(a<<1))
        document.write("Rightshift::"+(a>>1))
        document.write("Ones complement"+(~a))

    </script>
</body>
</html>
