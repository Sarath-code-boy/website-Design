<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Relative
        {
            position: relative;
            width: 400px;
            height: 200px;
            border: 3px solid red;
        }
        .Absolute
        {
            position: absolute;
            top: 80px;
            right: 0;
            width: 200px;
            height: 100px;
            border: 3px solid blue;
        }
    </style>
</head>
<body>
    <div class="Relative">
        This is the Relative
        <div class="Absolute">
            This is the Absolute
        </div>
    </div>
</body>
</html>
