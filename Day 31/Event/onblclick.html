<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onblclick</title>
</head>
<body>
    <p ondblclick="first()">Double click</p>
    <p id="demo"></p>
    <script>
        function first()
        {
            document.getElementById("demo").innerHTML="Welcome"
        }
    </script>
</body>
</html>
