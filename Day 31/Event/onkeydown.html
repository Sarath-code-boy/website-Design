<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on keydown</title>
</head>
<body>
    <input type="text" onkeydown="myfun()">
    <p id="d1"></p>
    <script>
        function myfun()
        {
            var x=event.key;
            document.getElementById("d1").innerHTML="your processed is:"+x;
        }
    </script>
</body>
</html>
