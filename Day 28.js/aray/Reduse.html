<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        //reduce mean bigining value to second value subraction(100-10+30)
        const num1=[100,10,30]
        document.getElementById("demo").innerHTML=num1.reduce(myfun);
        function myfun (total,num1)
        {
            return total-num1;
        }
    </script>
</body>
</html>
