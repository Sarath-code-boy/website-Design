    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>findLastIndex()</title>
</head>
<body>

<p id="demo"></p>

<script>
    const age = [10, 15, 30, 400, 500];

    document.getElementById("demo").innerHTML =
        age.findLastIndex(chkage);

    function chkage(age)
     {
        return age > 18;
    }
</script>


</body>
</html>
