<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funtion-2</title>
</head>
<body>
    <button type="button" onclick="sample()">Click here</button>
    <script>
        function sample()
        {
        n=parseInt(prompt("Enter the value is::"))
        if (n%2==0)
    {
        document.write("this is even"+n)
    }
    else
    {
        document.write("This is odd"+n)
    }
    }
    </script>
</body>
</html>
